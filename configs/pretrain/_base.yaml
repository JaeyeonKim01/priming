data:
  data_path: data/imagenet
  num_classes: 1000
  img_size: 256
  num_workers: 10
  pin_mem: true
model:
  model: OST_B
  patch_size: 16
  token_channels: 3
  tokenizer_patch_size: 1
  class_tokens: 8
  guidance_tokens: 0
  interval_tokens: 0
  label_drop_prob: 0.0
  rope_2d: true
  learned_pe: true
  corruption: denoising
  t_dist: uniform
  t_min: 0.8
  t_max: 0.8
  P_mean: 0.8
  P_std: 0.8
  noise_scale: 1.0
  cfg_beta: 1.0
  cfg_omega_max: 7.0
loss:
  norm_eps: 0.0001
  norm_p: 1.0
  perceptual_threshold: 0.8
  aux:
    enabled: true
    lpips_weight: 0.4
    convnext_weight: 0.1
    norm_eps: 0.01
    norm_p: 1.0
    random_crop: true
    crop_scale:
    - 0.08
    - 1.0
optimizer:
  optimizer: muon
  lr: 0.001
  min_lr: 0.0
  lr_sched: constant
  warmup_epochs: 0
  warmup_rate: 0.0
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  grad_clip: 0.0
train:
  epochs: 160
  steps_per_epoch: 1251
  micro_batch_size: 64
  gradient_accumulation_steps: 2
  seed: 1
  dtype: bf16
  ema_type: const
  ema_rates:
  - 0.9999
  compile: true
  measure_flops: true
  keep_n_ckpts: 3
  milestone_interval: 20
  print_freq: 50
