_base_: _base.yaml
model:
  dir_name: rt1_flow_xpred
  objective: flow_matching
  inner_model_cfg: RT1_UNet
  is_phase_2: false
  chunk_size: 8
  unet_1frame_spec: cfg
  cfg_alpha: 1.0
flow:
  p_mean: 0.8
  p_std: 0.8
  t_eps: 0.05
  noise_scale: 1.0
  train_cfg_scale: 1.0
  freeze_cfg_conditioner: true
  sampling_steps: 8
  solver: heun
rt1:
  dataset_dir: ${scratch_root}/data/rt1/processed/rt_1
  n_frames: 5
  action_dim: 10
  subset_names: ''
  input_h: 256
  input_w: 256
output_dir: outputs/world_modeling/pretrain/rt1
