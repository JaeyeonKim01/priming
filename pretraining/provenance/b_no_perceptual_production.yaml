# Proposed recipe for discussion; GPU preflight/restart work is tracked in
# docs/ost_b_pretraining_plan_20260912.md. Fresh pretraining only.
data:
  data_path: data/imagenet
  num_classes: 1000
  img_size: 256
  num_workers: 10
  pin_mem: true
  random_horizontal_flip: true

model:
  # Public OST_B resolves to OST_B2: 16 blocks, width 768, ~115M parameters.
  model: OST_B
  patch_size: 16
  tokenizer: null
  token_channels: 3
  tokenizer_patch_size: 1
  class_tokens: 8
  guidance_tokens: 0
  interval_tokens: 0
  # User chose to match OST-L; historical B80 used 0.1.
  label_drop_prob: 0.0
  rope_2d: true
  learned_pe: true
  corruption: denoising
  t_dist: uniform
  t_min: 0.8
  t_max: 0.8
  P_mean: 0.8
  P_std: 0.8
  noise_scale: 1.0
  cfg_beta: 1.0
  cfg_omega_max: 7.0

loss:
  norm_eps: 1e-4
  norm_p: 1.0
  # The mask is t <= threshold, so all examples receive auxiliary loss at t=0.8.
  perceptual_threshold: 0.8
  aux:
    enabled: false
    # Weights remain identical in both files; enabled=false bypasses the
    # complete auxiliary branch, including frozen encoders and random crops.
    lpips_weight: 0.4
    convnext_weight: 0.1
    norm_eps: 1e-2
    norm_p: 1.0
    random_crop: true
    crop_scale: [0.08, 1.0]

endpoint_ot:
  pre_ot_enabled: false
  pre_ot_weight: 0.0

optimizer:
  optimizer: muon
  lr: 1e-3
  min_lr: 0.0
  lr_sched: constant
  warmup_epochs: 0
  warmup_rate: 0.0
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  grad_clip: 0.0

train:
  epochs: 160
  steps_per_epoch: 1251
  stop_after_steps: null
  compile: true
  measure_flops: true
  # Exactly eight ranks: 64 x 2 x 8 = 1,024 images/update.
  micro_batch_size: 64
  gradient_accumulation_steps: 2
  seed: 1
  dtype: bf16
  ema_type: const
  ema_rates: [0.9999]
  ema_halflife_kimg: [250, 500, 1000, 2000]

  # A production wrapper must implement validated all-rank Muon/RNG restore
  # before enabling automatic resume; generic train_ost.py does not yet do so.
  auto_resume: false
  resume_from: null
  load_from: null
  keep_n_ckpts: 3
  save_freq: 1
  milestone_interval: 20

  output_dir: ./outputs
  local_eval_dir: null
  project: OST
  exp_name: priming_reference
  entity: priming
  enable_wandb: false
  print_freq: 50
  eval_freq: 0
  vis_freq: 0
  val_freq: 0
  last_elapsed_time: 0.0
  current_step: 1
  samples_seen: 0
