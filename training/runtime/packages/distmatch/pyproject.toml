[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distmatch"
version = "0.1.0"
description = "Distribution-matching objectives for image post-training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
models = ["timm>=1.0"]
pca-fit = ["scikit-learn>=1.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distmatch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
