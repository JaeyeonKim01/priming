train:
  start_epoch: 0
  # Continue an OST-B baseline for 50 * 1.28M = 64M MMD samples.
  # At 1,024 samples/update, each sample-epoch is 1,250 optimizer steps.
  epochs: 50
  steps_per_epoch: 1250
  # On eight H200s: 128 samples/GPU * 8 GPUs, with no feature replay.
  rollout_size: 1024
  batch_size: 128
  grad_accum: 1
  noise_scale: 1.0
  same_noise: false
  grad_checkpointing: false
  measure_flops: true

  # Runtime resume counters; keep defaults for a fresh run.
  last_elapsed_time: 0.0
  current_step: 0
  samples_seen: 0

model:
  model: OST_B
  img_size: 256
  patch_size: 16
  # Train the complete generator.
  train_last_n_blocks: null
  # These two generic config fields are inactive in the OST MMD sampling path.
  label_drop_prob: 0.0
  attn_dropout: 0.0
  proj_dropout: 0.0
  class_tokens: 8
  time_tokens: 0
  guidance_tokens: 0
  interval_tokens: 0
  norm_eps: 0.01
  norm_p: 1.0
  rope_2d: true
  learned_pe: true
  disable_v_head: false
  sampling_head: u
  freeze_inactive_head: true
  t_eps: 5e-2

tokenizer:
  tokenizer: null
  token_channels: 3
  tokenizer_patch_size: 1

optimizer:
  optimizer: adamw
  # Conservative constant post-training LR validated by the MMD pilot.
  lr: 1e-6
  min_lr: 0.0
  lr_sched: constant
  warmup_rate: 0.0
  warmup_epochs: 5
  weight_decay: 0.0
  # Conservative safety bound for the summed representation gradients.
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95
  muon_momentum: 0.95
  muon_weight_decay: 0.0

  ema_type: const
  ema_rates: [0.999]
  ema_halflife_kimg: [250, 500, 1000, 2000]
  eval_ema_labels: ["0.999"]

diffusion:
  P_mean: 0.8
  P_std: 0.8
  legacy_time_convention: false
  tr_uniform: false
  ratio_r_neq_t: 0.5
  cfg_beta: 1.0
  cfg_omega_max: 7.0
  aux_head_depth: 8
  loss_type: v
  aux_pred_type: v
  perceptual_threshold: 0.8
  perceptual_loss_on_aux: false

sampling:
  sampling_method: heun
  num_sampling_steps: 1
  cfg: 1.0
  cfg_list: [1.0]
  # Match the OST-B FD baseline's one-step sampling protocol.
  interval_min: 0.1
  interval_max: 1.0
  vis_steps: [1]

data:
  # Retain the ImageNet root used to build the class-conditional feature banks.
  data_path: data/imagenet
  num_classes: 1000
  # Controlled qualitative panel: the historical eight classes first, followed
  # by seven diverse held-out audit classes. This affects visualization only;
  # training and evaluation still sample all 1,000 classes below.
  class_of_interest: [207, 360, 387, 974, 88, 979, 417, 279, 1, 22, 130, 281, 530, 817, 980]
  force_class_of_interest: false
  num_workers: 10
  pin_mem: true

checkpointing:
  # Resume this run's newest checkpoint when a Slurm job is requeued/restarted.
  auto_resume: true
  resume_from: null
  load_from: null
  # Match the baseline's five-sample-epoch checkpoint cadence.
  keep_n_ckpts: 3
  milestone_interval: 5

evaluation:
  skip_final_eval: false
  online_eval: true
  num_images_for_eval_and_search: 50000
  num_images: 50000
  eval_bsz: 64
  fid_stats_path: data/fid_stats/guided_diffusion_stats.npz
  keep_eval_folder: false
  save_eval_images: false
  cfg_min: 1.0
  cfg_max: 25.0
  overwrite_cache: false
  prc_ref_dir: data/prc/VIRTUAL_imagenet256_labeled
  prc_k: 3
  prc_batch_size: 10000

mmd:
  # Each file is a class-labeled RealFeatureBank named siglip.pt, mae.pt, or
  # inception.pt. Every bank must contain ImageNet class IDs [0, 999].
  mmd_feature_bank_dir: data/mmd_feature_banks/imagenet256_n1281167_class_conditional
  # The three float32 banks occupy about 20.2 GiB per process. They are grouped
  # once by class and then kept resident for exact same-class attraction.
  mmd_feature_bank_device: cuda

  # Attraction kernel. RBF uses exp(-||x-y||^2 / (2 sigma^2)); L2-Laplacian
  # uses exp(-||x-y||_2 / ell).
  mmd_kernel: rbf
  # feature_bank reads the fixed per-representation median L2 distances from
  # build_summary.json. They are interpreted as sigma for RBF or ell for
  # L2-Laplacian. This may instead be overridden with a mapping:
  # {siglip: 17.803, mae: 2.769, inception: 18.540}.
  mmd_sigmas: feature_bank
  mmd_repr_weights: null
  mmd_normalize: none
  mmd_normalize_eps: 1e-2  # Inert while mmd_normalize=none.
  mmd_kernel_chunk_size: 1024

  # Canonical execution scores generated rows on their owning rank and omits
  # the gradient-free real-real constant. A detached global gather still
  # updates every queue in identical rank-concatenated order after scoring.
  # The slower global-row implementation remains only for parity regression.
  mmd_local_generated_scoring: true
  mmd_include_real_constant: false

  # Number of historical generated feature rows retained independently for
  # each of the 1,000 classes and for each representation. Repulsion compares
  # current rows only with detached history from the same class, then enqueues
  # the current rows. There is no current-current batch repulsion mode.
  mmd_repulsion_queue_size: 128
  # These controls affect only generated-to-queue repulsion. "attraction"
  # means reuse the attraction bandwidths and is allowed only when the queue
  # kernel matches the attraction kernel. L2-Laplacian uses
  # k(x,q) = exp(-||x-q||_2 / ell) and requires an explicit ell mapping.
  mmd_repulsion_queue_weight: 1.0
  mmd_repulsion_queue_kernel: rbf
  mmd_repulsion_queue_bandwidths: attraction

xm:
  # Optional IMLE-style forward matching branch.  Each selected real row picks
  # its nearest same-class generated candidate under one joint normalized
  # SigLIP/MAE/Inception distance.  The candidate pool is fresh, shared by the
  # real rows of that class, excluded from MMD, and never enters the Q4 queue.
  xm_enabled: false
  xm_weight: 0.0
  xm_num_classes_per_step: 16
  xm_targets_per_class: 4
  xm_candidates_per_class: 4
  # "row_wise_min" permits candidate reuse. "one_to_one" selects the exact
  # minimum-cost bijection and therefore requires equal target/candidate counts.
  xm_assignment: row_wise_min
  # This private, checkpointed stream samples XM classes, real rows, and noise
  # without changing the original MMD rollout RNG stream.
  xm_seed: 7919
  # Expensive per-branch parameter-gradient diagnostics are for the short beta
  # calibration only; ordinary XM metrics remain enabled in production.
  xm_log_branch_grad_norms: false

ot:
  # Balanced classwise OT reuses the main generated rollout. ``cross`` is the
  # historical behavior and adds no second generator forward.  The opt-in
  # Sinkhorn divergence subtracts OT(q, q') using an independent detached
  # generated population, removing finite-epsilon cross-OT self-bias.
  ot_enabled: false
  ot_objective: cross
  # Multiplier on the historical attraction + Q4-repulsion baseline.  Keep at
  # 1 for every existing recipe; set to 0 only for an explicit OT-first stage.
  ot_baseline_weight: 1.0
  lambda_ot: 0.0
  ot_num_classes: 16
  ot_samples_per_class: 64
  ot_num_real_refs: 128
  # Entropic regularization for the one joint SigLIP/MAE/Inception cost matrix.
  ot_epsilon: 0.05
  # Optional epsilon -> positive weight mapping. Normalized to sum to one;
  # replaces the single epsilon in BOTH cross and generated-self OT terms.
  ot_epsilon_mixture: null
  # Short probes only: per-scale gradients at generated feature rows, without
  # encoder/generator replay. Norms exclude lambda_ot and mixture weights.
  ot_log_feature_grad_norms: false
  ot_num_iters: 100
  # Set to 0 to force exactly ot_num_iters updates.
  ot_tolerance: 1.0e-6
  # Private checkpointed streams select global classes and real reference IDs.
  # Main-rollout noise remains on the existing checkpointed Torch/CUDA stream.
  ot_seed: 7919
  # Expensive rank-local parameter-gradient calibration; optimizer gradients
  # are still computed from the ordinary combined loss and are not changed.
  ot_log_grad_norms: false

lora:
  use_lora: false
  lora_mode: attention
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_adapter_path: null
  save_lora_adapter: null
  merge_lora_on_save: false

logging:
  output_dir: ./fdloss_work_dirs
  local_eval_dir: null
  print_freq: 10
  eval_freq: 0
  # Save and visualize every 5 * 1.28M generated samples, like the FD baseline.
  vis_freq: 5
  val_freq: 0
  save_freq: 5
  vis_only: false
  disable_vis: false
  project: OST
  entity: priming
  exp_name: null
  enable_wandb: false

system:
  seed: 1
  dtype: bf16
  compile: true
