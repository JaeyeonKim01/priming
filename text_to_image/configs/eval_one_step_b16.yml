name: priming_t2i_b16_one_step
train_config: configs/inference_b16_release.yml
checkpoint: ${T2I_CHECKPOINT_ROOT}/priming_t2i_b16.pt
checkpoint_target: ema
output_dir: ${T2I_EVAL_OUTPUT_ROOT}/priming_t2i_b16
python: ${T2I_PYTHON}
geneval_python: ${T2I_GENEVAL_PYTHON}
dpg_python: ${T2I_DPG_PYTHON}
nproc: 1

benchmarks:
  fid:
    enabled: false
  geneval:
    enabled: true
    generate: true
    evaluate: true
    samples_per_prompt: 4
    batch_size: 4
    steps: 1
    cfg_scale: 1.0
    metadata: ${T2I_GENEVAL_METADATA}
    model_path: ${T2I_GENEVAL_MODEL_ROOT}
  dpg:
    enabled: true
    generate: true
    evaluate: true
    samples_per_prompt: 4
    batch_size: 4
    steps: 1
    cfg_scale: 1.0
    data: ${T2I_DPG_BENCH_DATA}
    mplug_ckpt: ${T2I_DPG_MPLUG_CKPT}
    resolution: 512
